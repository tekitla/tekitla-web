<article
  class="vrb-kanban-card issue-card"
  [class.issue-card--pending]="pending()"
  [attr.data-priority]="kanbanPriority()"
  [attr.aria-busy]="pending() || null"
>
  <div class="issue-card__top">
    <span class="vrb-kanban-card__code">{{ key() }}</span>
    <button
      type="button"
      class="vrb-button vrb-button--ghost vrb-button--sm issue-card__move"
      [cdkMenuTriggerFor]="moveMenu"
      [disabled]="pending()"
      [attr.aria-label]="'board.card.moveLabel' | translate: { issue: key() }"
    >
      <ui-icon name="move" />
      <span aria-hidden="true">{{ 'board.card.move' | translate }}</span>
    </button>
  </div>

  <a
    class="vrb-kanban-card__title issue-card__link"
    [id]="'issue-link-' + issue().number"
    [routerLink]="link()"
    aria-keyshortcuts="Shift+ArrowLeft Shift+ArrowRight Shift+ArrowUp Shift+ArrowDown"
    aria-describedby="board-shortcut-hint"
    (keydown)="onKeydown($event)"
  >
    <span class="u-visually-hidden">{{ key() }}: </span>{{ issue().title }}
  </a>

  @if (labels().length) {
    <ul class="vrb-kanban-card__labels" [attr.aria-label]="'issue.labels' | translate">
      @for (label of labels(); track label.id) {
        <li [class]="'vrb-kanban-card__label vrb-kanban-card__label--' + labelTone[label.color]">
          {{ label.name }}
        </li>
      }
    </ul>
  }

  <div class="vrb-kanban-card__meta">
    <span class="vrb-kanban-card__priority">
      <span class="u-visually-hidden">{{ 'issue.priorityLabel' | translate }}: </span>
      {{ 'issue.priority.' + level() | translate }}
    </span>
  </div>
</article>

<ng-template #moveMenu>
  <div class="vrb-menu" cdkMenu>
    @for (status of targets(); track status.id) {
      <button
        type="button"
        class="vrb-menu__item"
        cdkMenuItem
        (cdkMenuItemTriggered)="moveTo(status.id)"
      >
        <span [class]="'vrb-segmented__dot vrb-segmented__dot--' + tone(status)"></span>
        {{ 'board.card.moveTo' | translate: { column: status.name } }}
      </button>
    }
    <div class="vrb-menu__separator" role="separator"></div>
    <button
      type="button"
      class="vrb-menu__item vrb-menu__item--danger"
      cdkMenuItem
      (cdkMenuItemTriggered)="discard()"
    >
      <ui-icon name="trash" />{{ 'board.card.discard' | translate }}
    </button>
  </div>
</ng-template>
