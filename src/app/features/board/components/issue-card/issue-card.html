<article
  class="vrb-kanban-card issue-card"
  [class.issue-card--pending]="pending()"
  [attr.data-priority]="kanbanPriority()"
  [attr.aria-busy]="pending() || null"
>
  <div class="issue-card__top">
    <span class="vrb-kanban-card__code">{{ key() }}</span>
    <button
      type="button"
      class="vrb-button vrb-button--ghost vrb-button--sm issue-card__move"
      [cdkMenuTriggerFor]="moveMenu"
      [disabled]="pending()"
      [attr.aria-label]="'board.card.moveLabel' | translate: { issue: key() }"
    >
      <ui-icon name="move" />
      <span aria-hidden="true">{{ 'board.card.move' | translate }}</span>
    </button>
  </div>

  <a
    class="vrb-kanban-card__title issue-card__link"
    [id]="'issue-link-' + issue().number"
    [routerLink]="link()"
    aria-keyshortcuts="Shift+ArrowLeft Shift+ArrowRight"
    aria-describedby="board-shortcut-hint"
    (keydown)="onKeydown($event)"
  >
    <span class="u-visually-hidden">{{ key() }}: </span>{{ issue().title }}
  </a>

  <div class="vrb-kanban-card__meta">
    <span class="vrb-kanban-card__priority">
      <span class="u-visually-hidden">{{ 'issue.priorityLabel' | translate }}: </span>
      {{ 'issue.priority.' + level() | translate }}
    </span>
  </div>
</article>

<ng-template #moveMenu>
  <div class="vrb-menu" cdkMenu>
    @for (state of targets(); track state) {
      <button
        type="button"
        class="vrb-menu__item"
        cdkMenuItem
        (cdkMenuItemTriggered)="moveTo(state)"
      >
        {{ 'board.card.moveTo' | translate: { column: ('board.columns.' + state | translate) } }}
      </button>
    }
  </div>
</ng-template>
