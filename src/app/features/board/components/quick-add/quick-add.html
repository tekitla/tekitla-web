@let id = 'quick-add-' + statusId();
@if (open()) {
  <form class="quick-add" novalidate (submit)="$event.preventDefault(); submit()">
    <label class="u-visually-hidden" [for]="id">{{
      'board.quickAdd.label' | translate: { column: column() }
    }}</label>
    <input
      #field
      class="vrb-input quick-add__input"
      type="text"
      autocomplete="off"
      enterkeyhint="done"
      [id]="id"
      [maxLength]="max"
      [placeholder]="'board.quickAdd.placeholder' | translate"
      [value]="title()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? id + '-error' : id + '-hint'"
      (input)="onInput(field.value)"
      (keydown.escape)="close($event)"
      (blur)="onBlur()"
    />
    @if (error(); as error) {
      <p class="vrb-field__error quick-add__note" role="alert" [id]="id + '-error'">
        @if (error.kind === 'failed') {
          {{ 'board.quickAdd.failed' | translate: { title: error.title } }}
        } @else {
          {{ 'board.quickAdd.required' | translate }}
        }
      </p>
    } @else {
      <p class="vrb-field__hint quick-add__note" [id]="id + '-hint'">
        {{ 'board.quickAdd.hint' | translate }}
      </p>
    }
  </form>
} @else {
  <button #opener type="button" class="vrb-kanban__add" (click)="show()">
    <ui-icon name="plus" />
    <span aria-hidden="true">{{ 'board.quickAdd.button' | translate }}</span>
    <span class="u-visually-hidden">{{
      'board.quickAdd.buttonLabel' | translate: { column: column() }
    }}</span>
  </button>
}
