<main class="login">
  <section class="login__card" aria-labelledby="login-title">
    <p class="login__brand" aria-hidden="true">Tekitla</p>
    <h1 id="login-title" class="login__title">{{ 'auth.login.title' | translate }}</h1>
    <p class="login__lead">{{ 'auth.login.lead' | translate }}</p>

    @if (!configured) {
      <p class="login__error" role="alert">{{ 'auth.login.notConfigured' | translate }}</p>
    }

    @if (failed()) {
      <p class="login__error" role="alert">{{ 'auth.login.error' | translate }}</p>
    }

    <ui-button
      [loading]="loading()"
      [disabled]="!configured"
      [fullWidth]="true"
      (pressed)="signIn()"
    >
      <span class="login__google" aria-hidden="true">G</span>
      {{ 'auth.login.google' | translate }}
    </ui-button>
  </section>
</main>
