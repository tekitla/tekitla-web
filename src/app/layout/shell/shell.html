<a class="shell__skip" href="#contenido">{{ 'shell.skip' | translate }}</a>

<header class="shell__header">
  <a class="shell__brand" routerLink="/">{{ title }}</a>

  <nav class="shell__nav" [attr.aria-label]="'shell.nav.label' | translate">
    <a
      class="shell__nav-link"
      routerLink="/proyectos"
      routerLinkActive="shell__nav-link--active"
      ariaCurrentWhenActive="page"
    >
      {{ 'shell.nav.projects' | translate }}
    </a>
  </nav>

  <div class="shell__user">
    @if (session.user(); as user) {
      <span class="shell__user-email">{{ user.email }}</span>
    }
    <ui-button variant="ghost" size="sm" (pressed)="logout()">
      {{ 'shell.logout' | translate }}
    </ui-button>
  </div>
</header>

<main id="contenido" class="shell__main" tabindex="-1">
  <router-outlet />
</main>
